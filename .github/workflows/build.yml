name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install openpyxl reportlab pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --windowed --name KoliEtiketi etiket_uygulamasi.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoliEtiketi-exe
          path: dist/KoliEtiketi.exe
